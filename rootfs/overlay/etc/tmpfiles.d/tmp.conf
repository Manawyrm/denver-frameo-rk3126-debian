# Overrides /usr/lib/tmpfiles.d/tmp.conf: no age-based cleanup of /tmp.
# The frame has no RTC and boots with a clock months in the past; after
# the NTP jump the daily cleanup would delete everything created at boot
# (e.g. /tmp/.X11-unix, then Xwayland fails for non-root users). /tmp is a
# tmpfs and starts empty on every boot anyway.
q /tmp 1777 root root -
